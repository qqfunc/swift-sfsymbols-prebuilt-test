name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.build.platform }})
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        build:
        - platform: macOS
          destination: 'platform=macOS,name=My Mac'
        - platform: iOS
          destination: 'platform=iOS Simulator,OS=26.4,name=iPhone 17'
        - platform: tvOS
          destination: 'platform=tvOS Simulator,OS=26.4,name=Apple TV 4K (3rd generation)'
        - platform: visionOS
          destination: 'platform=visionOS Simulator,OS=26.4,name=Apple Vision Pro'
        - platform: watchOS
          destination: 'platform=watchOS Simulator,OS=26.4,name=Apple Watch Series 11 (46mm)'
    steps:
    - name: Checkout ${{ github.repository }}
      uses: actions/checkout@v6.0.2
    - name: Install SF Symbols
      run: |
        brew update
        brew install --cask sf-symbols
    - name: Select Xcode
      run: xcode-select -s /Applications/Xcode_26.4.app
    - name: Test
      run: xcodebuild -scheme swift-sfsymbols-artifacts -destination '${{ matrix.build.destination }}' test
    - name: Build
      run: ./build.sh ${{ matrix.build.platform }}
    - name: Upload Artifact
      uses: actions/upload-artifact@v7.0.1
      with:
        name: SFSymbols-${{ matrix.build.platform }}.xcframework
        path: Artifacts/SFSymbols-${{ matrix.build.platform }}.xcframework
        if-no-files-found: 'error'
        retention-days: 1
